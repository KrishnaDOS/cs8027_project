name: e1_chain_hops
description: >
  Beijing-Shanghai-like chain (32 trusted nodes, 63.8 km spacing), uniform traffic, SPR.
  Outage and latency broken down by hop count (by_hops.csv). On a chain SPR = KAR, so
  KAR runs once (rho=0.5, seed 0) as a sanity check (Addendum D).
base: ../../configs/default.yaml
overrides:
  topology: {type: chain, n_nodes: 32}
seeds: [0, 1, 2, 3, 4]
grid:
  traffic.offered_load: [0.2, 0.5, 0.8]
  routing.strategy: [spr]
extra_runs:
  - set: {traffic.offered_load: 0.5, routing.strategy: kar}
    seeds: [0]
